spring.application.name=moving-service
# Port 8080 and 8081 are already used by other programs on this machine.
server.port=8090

# ----- MySQL -----
# Database "moving_service" is created automatically on first run.
# Pass your MySQL password through the DB_PASSWORD environment variable.
# Do not write a real password in this file: it is tracked by git.
spring.datasource.url=jdbc:mysql://localhost:3306/moving_service?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates tables from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ----- JWT -----
# Development secret only (at least 32 characters). Override with JWT_SECRET when deploying.
app.jwt.secret=${JWT_SECRET:moving-service-dev-secret-key-change-me-0123456789}
app.jwt.expiration-minutes=480

# ----- Pricing -----
# Fixed surcharge per floor (VND), applied to pickup floors + delivery floors. Ground floor = 0.
app.pricing.floor-fee=50000

# ----- Default admin account, created on first run if it does not exist -----
app.admin.email=admin@moving.local
app.admin.password=Admin@123
