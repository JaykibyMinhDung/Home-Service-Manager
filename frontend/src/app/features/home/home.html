<section class="card border-0 shadow-sm">
  <div class="card-body p-4 p-md-5">
    <h1 class="h2 mb-3">Chuyển nhà trọn gói, đặt lịch trong vài phút</h1>
    <p class="text-secondary mb-4">
      Chọn loại xe, nhập địa chỉ và thời gian, hệ thống báo giá ước tính ngay. Nhân viên sẽ xác
      nhận và phân công xe cùng đội vận chuyển cho bạn.
    </p>

    @if (auth.isLoggedIn()) {
      <a class="btn btn-primary me-2" routerLink="/booking">Đặt dịch vụ</a>
      <a class="btn btn-outline-primary" routerLink="/my-orders">Đơn của tôi</a>
    } @else {
      <a class="btn btn-primary me-2" routerLink="/register">Đăng ký để đặt dịch vụ</a>
      <a class="btn btn-outline-primary" routerLink="/login">Đăng nhập</a>
    }
  </div>
</section>
