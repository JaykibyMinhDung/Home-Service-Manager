<div class="auth-page">
  <div class="card shadow-sm auth-card">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Đăng ký tài khoản</h1>
      <p class="text-secondary mb-4">Dành cho khách hàng đặt dịch vụ chuyển nhà</p>

      @if (error()) {
        <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-3">
          <label class="form-label" for="fullName">Họ tên</label>
          <input
            id="fullName"
            type="text"
            class="form-control"
            formControlName="fullName"
            autocomplete="name"
            [class.is-invalid]="form.controls.fullName.touched && form.controls.fullName.invalid"
          />
          <div class="invalid-feedback">Nhập họ tên.</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            autocomplete="email"
            [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid"
          />
          <div class="invalid-feedback">Nhập email đúng định dạng.</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="phone">Số điện thoại</label>
          <input
            id="phone"
            type="tel"
            class="form-control"
            formControlName="phone"
            autocomplete="tel"
            [class.is-invalid]="form.controls.phone.touched && form.controls.phone.invalid"
          />
          <div class="invalid-feedback">Số điện thoại gồm 10 chữ số, bắt đầu bằng 0.</div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="password">Mật khẩu</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="new-password"
            [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
          />
          <div class="invalid-feedback">Mật khẩu từ 6 ký tự.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
          {{ submitting() ? 'Đang đăng ký...' : 'Đăng ký' }}
        </button>
      </form>

      <p class="text-center mt-4 mb-0">Đã có tài khoản? <a routerLink="/login">Đăng nhập</a></p>
    </div>
  </div>
</div>
