<app-page-header
  heading="Thống kê"
  subtitle="Doanh thu chỉ tính đơn Hoàn thành, theo giá chốt và theo tháng của ngày chuyển."
>
  <select class="form-select" aria-label="Chọn năm" (change)="selectYear($any($event.target).value)">
    @for (option of years; track option) {
      <option [value]="option" [selected]="option === year()">Năm {{ option }}</option>
    }
  </select>
</app-page-header>

@if (error()) {
  <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
}

<div class="row g-3 mb-3">
  <div class="col-md-3">
    <app-stat-card label="Doanh thu năm" [value]="totalRevenue()" hint="Đơn đã hoàn thành" />
  </div>
  <div class="col-md-3">
    <app-stat-card label="Tổng số đơn" [value]="totalOrders().toString()" hint="Mọi trạng thái" />
  </div>
  <div class="col-md-3">
    <app-stat-card
      label="Đơn hoàn thành"
      [value]="countOf('COMPLETED').toString()"
      [hint]="percent(countOf('COMPLETED')) + ' tổng số đơn'"
    />
  </div>
  <div class="col-md-3">
    <app-stat-card
      label="Đơn đã hủy"
      [value]="countOf('CANCELLED').toString()"
      [hint]="percent(countOf('CANCELLED')) + ' tổng số đơn'"
    />
  </div>
</div>

<app-section-card heading="Doanh thu theo tháng (triệu đồng)">
  <app-bar-chart [values]="revenueInMillions()" [labels]="monthLabels" [format]="formatMillion" />
</app-section-card>

<app-page-header heading="Số đơn theo trạng thái" />
<app-data-table>
  <thead>
    <tr>
      <th>Trạng thái</th>
      <th class="text-end">Số đơn</th>
      <th class="text-end">Tỷ lệ</th>
    </tr>
  </thead>
  <tbody>
    @for (row of sortedCounts(); track row.status) {
      <tr>
        <td><app-status-badge kind="order" [value]="row.status" /></td>
        <td class="text-end">{{ row.count }}</td>
        <td class="text-end">{{ percent(row.count) }}</td>
      </tr>
    } @empty {
      <tr>
        <td colspan="3" class="table-empty">{{ loading() ? 'Đang tải...' : 'Chưa có dữ liệu.' }}</td>
      </tr>
    }
  </tbody>
</app-data-table>
